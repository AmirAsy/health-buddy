<html lang="en">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="CSS/style.css">
  <link rel="stylesheet" href="CSS/health-news-style.css">
  <link rel="stylesheet" href="CSS/read-more.css">
  <title>Health News</title>
</head>
<body>
  <!--Navbar-->
  <div id="navbar"></div>
    
    <!--Health News Section-->
    <div class="container">

    <h1>Latest Health News</h1>

    <p class="subtitle">
        Stay informed with the latest developments in health and wellness
    </p>
    
    <!--News Container-->
    <div id="news-container"></div>

    </div>

        <button onclick="adjustFontSize('increase')">+</button>
        <button onclick="adjustFontSize('decrease')">-</button>

     </div>

    <div id="footer"></div>
    
    <!--JS file-->
