<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disease</title>

  <link rel="stylesheet" href="CSS/style.css">
  <link rel="stylesheet" href="CSS/health-tips-search.css">
  <link rel="stylesheet" href="CSS/health-tips-status.css">
  <link rel="stylesheet" href="CSS/disease-style.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="disease-container">
    <h1>Disease & Symptom Search</h1>
    <p>Search symptoms such as fever, cough, headache, or fatigue.</p>

    <div class="disease-search-box">
      <input type="text" id="diseaseSearch" placeholder="Example: fever">
      <button id="searchBtn">Search</button>
    </div>

    <p id="loading"></p>
    <p id="result-count"></p>

    <div id="diseaseResults" class="disease-results"></div>
  </main>

  <button id="backToTopBtn">↑ Top</button>

  <div id="footer"></div>

  <script src="JS/navbar.js"></script>
  <script src="JS/footer.js"></script>
  <script src="JS/disease.js"></script>
  <script src="JS/back-to-top.js"></script>
</body>
</html>
