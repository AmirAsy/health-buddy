<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Tips</title>

    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/health-tips-layout.css">
    <link rel="stylesheet" href="CSS/health-tips-search.css">
    <link rel="stylesheet" href="CSS/health-tips-card.css">
    <link rel="stylesheet" href="CSS/alphabet-filter.css">
    <link rel="stylesheet" href="CSS/health-tips-status.css">
</head>

<body>

    <!-- Navbar -->
    <div id="navbar"></div>

    <!-- Health Tips Section -->
    <div class="container">

        <h3>
            Type a keyword to quickly find related health tips.
        </h3>

        <!-- Loading -->
        <p id="loading">Loading...</p>

        <!-- Search + Alphabet Filter -->
        <div class="search-filter-row">

            <!-- Alphabet Filter -->
            <div class="alphabet-filter">

                <p>Find health tips by first letter</p>

                <div id="alphabet-buttons"></div>

            </div>

            <!-- Search Section -->
            <div class="search-section">

                <h2>Search health tips :</h2>

                <input
                    type="text"
                    id="search"
                    placeholder="Search Here"
                >

        </div>

        </div>

        <!-- Tips Result -->
        <div class="tips-content">

            <p id="result-count"></p>

            <div id="tips-container"></div>

        </div>

    </div>

    <!-- Back To Top Button -->
    <button id="backToTopBtn">
        ↑ Top
    </button>

    <!-- Footer -->
    <div id="footer"></div>

    <!-- JS Files -->
    <script src="JS/navbar.js"></script>
    <script src="JS/footer.js"></script>

    <script src="JS/health-tips-render.js"></script>
    <script src="JS/health-tips-search.js"></script>
    <script src="JS/alphabet-filter.js"></script>
    <script src="JS/health-tips-main.js"></script>

    <script src="JS/back-to-top.js"></script>

</body>
</html>
