<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Buddy - Symptom Checker</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <div id="navbar"></div>

    <main class="symptom-container">
        <div class="top-row">
            <h1>Symptom Checker</h1>
            </div>
        
        <h2>What are your symptoms?</h2>

        <div class="content-grid">
            <div class="left-panel">
                <div class="symptom-list">
                    <label>Fever <input type="checkbox" class="symptom-checkbox" value="Fever"></label>
                    <label>Headache <input type="checkbox" class="symptom-checkbox" value="Headache"></label>
                    <label>Coughing <input type="checkbox" class="symptom-checkbox" value="Coughing"></label>
                    <label>Runny Nose <input type="checkbox" class="symptom-checkbox" value="Runny Nose"></label>
                    <label>Nausea <input type="checkbox" class="symptom-checkbox" value="Nausea"></label>
                    <label>Fatigue <input type="checkbox" class="symptom-checkbox" value="Fatigue"></label>
                    <label>Chills <input type="checkbox" class="symptom-checkbox" value="Chills"></label>
                </div>

                <button class="show-results-btn" onclick="showResults()">Show Results</button>
            </div>

            <div class="right-panel">
                <div class="result-box" id="result-display">
                    <div style="text-align:center; width:100%; color: #666;">
                        Select your symptoms and click "Show Results"
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer"></div>
    
    <script src="JS/navbar.js"></script>
    <script src="JS/footer.js"></script>
    <script src="JS/symptom-checker-page.js"></script>
</body>
</html>
